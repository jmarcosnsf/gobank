version: 2
sql:
  - engine: "postgresql"
    queries: "./queries"
    schema: "./migrations"
    gen:
      go:
        emit_json_tags: true
        out: "."
        package: "pgstore"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - column: "individual_holder.monthly_income"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          - column: "company_holder.annual_revenue"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "NullDecimal"
          - db_type: "numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"