services:
  db: 
    image: postgres:16
    restart: unless-stopped
    ports:
      - ${GOBANK_DATABASE_PORT:-5432}:5432
    environment:
      POSTGRES_USER: ${GOBANK_DATABASE_USER}
      POSTGRES_PASSWORD: ${GOBANK_DATABASE_PASSWORD}
      POSTGRES_DB: ${GOBANK_DATABASE_NAME}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GOBANK_DATABASE_USER:-gobank} -d ${GOBANK_DATABASE_NAME:-gobank}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db: